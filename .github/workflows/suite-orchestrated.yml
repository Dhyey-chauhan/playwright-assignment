name: Suite — B. orchestrated (8 machines)

# Run this SECOND, after workflow A. The same WHOLE repo suite (~4066 tests
# across 171 files) at the same parallelism (8 ways x 4 workers) — but work is
# handed out at runtime from a duration-ordered queue instead of being
# pre-chopped by count.
#
# The number to compare is "wall clock" in the job summary. A also reports the
# spread between its fastest and slowest shard; that idle time is what this
# workflow should reclaim.
#
# W (workers) is read from playwright.config.ts at DISCOVER time, not from a CLI
# flag, so PW_WORKERS must match what the machines actually run with — hence it
# is set once at workflow level and used by both jobs.
on:
  workflow_dispatch:
    inputs:
      machines:
        description: 'Machines to distribute across'
        type: string
        default: '8'
      workers:
        description: 'Workers per machine (must match workflow A)'
        type: string
        default: '4'

defaults:
  run:
    shell: bash

env:
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
  TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL || secrets.TESTDINO_SERVER_URL || 'https://stg-reporter.testdino.com/' }}
  TESTDINO_TAGS: suite,orchestrated,${{ github.ref_name }}
  PW_PROJECT: chromium
  PW_WORKERS: ${{ inputs.workers }}

concurrency:
  group: suite-orchestrated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Mint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    outputs:
      orchestration-id: ${{ steps.mint.outputs.orchestration-id }}
      machine-indices: ${{ steps.mint.outputs.machine-indices }}
      spec-count: ${{ steps.mint.outputs.spec-count }}
      total-tests: ${{ steps.mint.outputs.total-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      - name: Preflight credentials
        run: |
          [ -n "${TESTDINO_TOKEN:-}" ] || { echo "::error::secrets.TESTDINO_TOKEN is empty."; exit 1; }
          case "$TESTDINO_TOKEN" in td_api_*) ;; *) echo "::error::not a td_api_ pipeline token."; exit 1 ;; esac
          echo "serverUrl : $TESTDINO_SERVER_URL"
          echo "workers   : $PW_WORKERS (read from playwright.config.ts at mint time)"

      - name: Mint the orchestration
        id: mint
        env:
          ORCH_MACHINES: ${{ inputs.machines }}
          DOTENV_CONFIG_QUIET: 'true'
        run: |
          set -euo pipefail
          npx tdpw orchestrate discover \
            --machines="$ORCH_MACHINES" --project="$PW_PROJECT" --out orch.json

          node -e '
            const m = require("./orch.json");
            for (const k of ["orchestrationId","created","machines","workers","fullyParallel","specCount","totalTests"])
              console.log(`${k.padEnd(16)}: ${m[k]}`);
          '

          id=$(node -p "require('./orch.json').orchestrationId || ''")
          [ -n "$id" ] || { echo "::error::mint returned no orchestrationId"; cat orch.json; exit 1; }

          # W must match what the machines will actually use, or the queue is
          # sized for a concurrency that never happens.
          got_workers=$(node -p "require('./orch.json').workers")
          if [ "$got_workers" != "$PW_WORKERS" ]; then
            echo "::error::mint recorded workers=$got_workers but PW_WORKERS=$PW_WORKERS"
            exit 1
          fi

          {
            echo "orchestration-id=$id"
            echo "spec-count=$(node -p "require('./orch.json').specCount")"
            echo "total-tests=$(node -p "require('./orch.json').totalTests")"
            echo "machine-indices=$(node -p "JSON.stringify(Array.from({length: require('./orch.json').machines}, (_, i) => i + 1))")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the mint response
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mint
          path: orch.json
          retention-days: 7

  run:
    name: Machine ${{ matrix.machineIndex }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        machineIndex: ${{ fromJSON(needs.discover.outputs.machine-indices) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # --project MUST use the = form (Playwright declares it variadic, so the
      # space form eats the spec paths appended after it), and --device-id MUST be
      # unique per machine or the extra machines are starved and the run hangs.
      # The discovery --grep is echoed back by the hub; do not pass it again here.
      - name: Join and run assigned batches
        continue-on-error: true
        env:
          ORCH_ID: ${{ needs.discover.outputs.orchestration-id }}
          DEVICE_ID: machine-${{ matrix.machineIndex }}-${{ github.run_id }}
          DOTENV_CONFIG_QUIET: 'true'
        run: |
          set -uo pipefail
          start=$(date +%s)
          npx tdpw orchestrate run \
            --orchestration-id "$ORCH_ID" \
            --device-id "$DEVICE_ID" \
            --project="$PW_PROJECT" \
            --output=test-results-m${{ matrix.machineIndex }} 2>&1 | tee machine.log
          rc=${PIPESTATUS[0]}
          finish=$(date +%s)
          {
            echo "unit=${{ matrix.machineIndex }}"
            echo "device_id=$DEVICE_ID"
            echo "exit_code=$rc"
            echo "started_at=$start"
            echo "finished_at=$finish"
            echo "duration=$(( finish - start ))"
            echo "batches=$(grep -c 'run:begin delivered' machine.log || echo 0)"
          } > machine.meta
          cat machine.meta

      - name: Upload machine evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: machine-${{ matrix.machineIndex }}
          path: |
            machine.log
            machine.meta
          retention-days: 7

  summary:
    name: Wall clock + integrity
    needs: [discover, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: evidence

      - name: Report and assert
        env:
          SPEC_COUNT: ${{ needs.discover.outputs.spec-count }}
          TOTAL_TESTS: ${{ needs.discover.outputs.total-tests }}
          ORCH_ID: ${{ needs.discover.outputs.orchestration-id }}
        run: |
          node <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('fs'), path = require('path');
          const strip = s => s.replace(/\x1b\[[0-9;]*[A-Za-z]/g, '');
          const specCount = Number(process.env.SPEC_COUNT);
          const totalTests = Number(process.env.TOTAL_TESTS);

          const machines = fs.readdirSync('evidence').filter(d => d.startsWith('machine-')).map(d => {
            const log = strip(fs.readFileSync(path.join('evidence', d, 'machine.log'), 'utf8'));
            const meta = Object.fromEntries(fs.readFileSync(path.join('evidence', d, 'machine.meta'), 'utf8')
              .trim().split('\n').map(l => l.split('=')));
            const files = [...new Set([...log.matchAll(/tests\/[\w/.-]+\.spec\.ts/g)].map(m => m[0]))];
            const tests = new Set([...log.matchAll(/›\s+(tests\/[^\s]+:\d+:\d+)/g)].map(m => m[1]));
            return { meta, files, tests, dur: Number(meta.duration),
                     start: Number(meta.started_at), end: Number(meta.finished_at) };
          }).sort((a, b) => Number(a.meta.unit) - Number(b.meta.unit));

          const wall = Math.max(...machines.map(m => m.end)) - Math.min(...machines.map(m => m.start));
          const slowest = Math.max(...machines.map(m => m.dur));
          const fastest = Math.min(...machines.map(m => m.dur));

          console.log('### B. Orchestrated\n');
          console.log(`Orchestration \`${process.env.ORCH_ID}\` — ${specCount} spec files, ${totalTests} tests discovered.\n`);
          console.log('| Machine | Files | Tests | Batches | Duration |');
          console.log('| --- | ---: | ---: | ---: | ---: |');
          for (const m of machines)
            console.log(`| ${m.meta.unit} | ${m.files.length} | ${m.tests.size} | ${m.meta.batches} | ${m.dur}s |`);
          console.log('');
          console.log('| | |');
          console.log('| --- | ---: |');
          console.log(`| **Wall clock** | **${wall}s** |`);
          console.log(`| Slowest machine | ${slowest}s |`);
          console.log(`| Fastest machine | ${fastest}s |`);
          console.log(`| Spread (idle time) | ${slowest - fastest}s |`);
          console.log('');
          console.log('Compare **wall clock** and **spread** against workflow A on the same suite.\n');

          // integrity — these can turn the job red; timings above never do
          const fail = [];
          const seen = new Map();
          for (const m of machines) for (const f of m.files)
            seen.set(f, [...(seen.get(f) || []), m.meta.unit]);
          const dupes = [...seen].filter(([, u]) => u.length > 1);
          if (dupes.length) fail.push(`${dupes.length} spec(s) dispatched to more than one machine`);
          if (seen.size !== specCount) fail.push(`${seen.size} spec files executed, mint queued ${specCount}`);
          const allTests = new Set(machines.flatMap(m => [...m.tests]));
          if (allTests.size !== totalTests) fail.push(`${allTests.size} tests executed, discovery counted ${totalTests}`);
          const starved = machines.filter(m => m.files.length === 0);
          if (starved.length) fail.push(`${starved.length} machine(s) received no work — check for duplicate device ids`);

          if (fail.length) {
            console.log('**Integrity failures**\n');
            for (const f of fail) console.log(`- ${f}`);
            for (const f of fail) console.error(`::error::${f}`);
            process.exit(1);
          }
          console.log('Integrity: every spec dispatched exactly once, all discovered tests executed, no starved machine.');
          JS
