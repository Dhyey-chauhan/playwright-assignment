name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'failures = evidence specs run and fail (PR comment shows failed rows); all-pass = green run (no evidence section)'
        type: choice
        options:
          - failures
          - all-pass
        default: failures
      update_snapshots:
        description: 'Regenerate Linux visual baselines instead of running the suite'
        type: boolean
        default: false

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned to the installed @playwright/test version. The suite is mostly
    # toHaveScreenshot(), so rendering has to be byte-identical run to run —
    # a bare ubuntu-latest runner drifts as GitHub rebuilds the image.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TestDino reads branch / commit / author from git metadata

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # The suite is deliberately narrowed while the PR-comment evidence links are
      # being verified: a full run is slow and most of it adds no new row shape to
      # the comment. GREEN_SPECS is a representative slice that always passes
      # (real storefront flow, network mocking, AI-generated scenarios);
      # FAILING_SPECS adds the evidence cases plus the status-variety spec
      # (skipped / fixme / expected-failure / timed out / flaky).
      #
      #   scenario = failures (default)  GREEN_SPECS + FAILING_SPECS -> red run,
      #                                  PR comment must show the evidence section
      #   scenario = all-pass            GREEN_SPECS only -> green run, PR comment
      #                                  must stay in its normal shape, no evidence
      #
      # push / pull_request events have no input, so they take the default.
      - name: Run Playwright tests
        shell: bash
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          # Runs are reported to staging unless the repo variable overrides it.
          TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL || 'https://stg-reporter.testdino.com/' }}
          # Run-level label on the TestDino run: the PR's source branch, or the
          # branch that was pushed.
          TESTDINO_TAGS: ${{ github.head_ref || github.ref_name }}
          SLACK_ALERT_CHANNEL: ${{ secrets.SLACK_ALERT_CHANNEL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SCENARIO: ${{ inputs.scenario || 'failures' }}
        run: |
          GREEN_SPECS="tests/part-1/add-to-cart.spec.ts \
            tests/part-1/network-states.spec.ts \
            tests/part-2/ai-generated.spec.ts"
          FAILING_SPECS="tests/pr-comment/ \
            tests/testing/test.faile.spec.ts \
            tests/part-3/run-status-coverage.spec.ts"

          if [ "$SCENARIO" = "all-pass" ]; then
            echo "scenario=all-pass -> expecting a fully green run"
            npx playwright test $GREEN_SPECS
          else
            echo "scenario=failures -> expecting failures with trace/screenshot/video evidence"
            npx playwright test $GREEN_SPECS $FAILING_SPECS
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Baselines in this repo are *-chromium-darwin.png (captured on macOS). The job
  # above runs on Linux and needs *-chromium-linux.png, so run this once from the
  # Actions tab (workflow_dispatch -> update_snapshots = true), download the
  # artifact, and commit the files into the tests/**-snapshots/ directories.
  update-snapshots:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # The intentional-mismatch tests deliberately mutate the page and then
      # compare against a baseline another test owns (homepage.png,
      # demo-baseline.png, product-card-baseline.png). Under --update-snapshots
      # they would overwrite those baselines with the mutated page and silently
      # break the demos, so they are excluded here.
      - name: Regenerate Linux baselines
        continue-on-error: true
        env:
          TESTDINO_TOKEN: ''
        run: |
          npx playwright test --update-snapshots \
            --grep-invert "@viewport-mismatch|@injected-element|@banner-diff|@color-diff|@hidden-header|@layout-shift|@pixel-perfect|@card-modified|@strict"

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/**/*-snapshots/**
          retention-days: 7
          if-no-files-found: error
