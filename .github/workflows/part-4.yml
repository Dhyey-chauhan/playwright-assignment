name: Part 4

# Manual only — this is a fixture suite, not a gate. It runs nothing but
# tests/part-4, where 10 tests are built to pass and 10 are built to fail.
# Both browsers by default, so a full run is 40 executions: 20 passed, 20 failed.
on:
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Which browsers to run part-4 under'
        type: choice
        options: ['chromium + firefox', 'chromium only', 'firefox only']
        default: 'chromium + firefox'
      subset:
        description: 'Which half to run'
        type: choice
        options: ['all (10 pass + 10 fail)', 'passing only', 'failing only']
        default: 'all (10 pass + 10 fail)'

defaults:
  run:
    shell: bash

concurrency:
  group: part-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part-4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the installed @playwright/test version so the runner image can't
    # drift out from under the suite.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TestDino reads branch / commit / author from git metadata

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # Ten of these tests fail on purpose, so playwright exits non-zero on a
      # healthy run. The exit code is ignored here and the real check happens in
      # the next step, which compares each test's outcome to its
      # @part-4-pass / @part-4-fail tag.
      - name: Run part-4
        id: run
        continue-on-error: true
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL }}
          TESTDINO_TAGS: part-4,${{ github.head_ref || github.ref_name }}
          PW_JSON_REPORT: part-4-report.json
        run: |
          # --project is repeatable; both browsers land in ONE playwright run and
          # so in one TestDino run, rather than two disconnected ones.
          case "${{ inputs.browsers }}" in
            'chromium only') project_args=(--project=chromium) ;;
            'firefox only')  project_args=(--project=firefox) ;;
            *)               project_args=(--project=chromium --project=firefox) ;;
          esac

          case "${{ inputs.subset }}" in
            'passing only') grep_args=(--grep @part-4-pass) ;;
            'failing only') grep_args=(--grep @part-4-fail) ;;
            *)              grep_args=() ;;
          esac

          npx playwright test tests/part-4 \
            "${project_args[@]}" \
            "${grep_args[@]}"

      - name: Check every outcome against its tag
        run: node scripts/verify-part-4-outcomes.js part-4-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-4-report
          path: |
            playwright-report/
            test-results/
            part-4-report.json
          retention-days: 7
