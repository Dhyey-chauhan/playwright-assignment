name: Part 4

# Manual only — this is a fixture suite, not a gate. It runs nothing but
# tests/part-4, under chromium AND firefox. 21 tests per engine, so a full run
# is 42 executions: 21 passed and 21 failed. The split differs by engine —
# chromium 11 pass / 10 fail, firefox 10 pass / 11 fail — because P11 asserts a
# Chromium user-agent and is tagged to fail on Gecko.
#
# No workflow_dispatch inputs on purpose: every input GitHub sees becomes a
# form field on the "Run workflow" button, and there is nothing here worth
# choosing. Press the button, get the whole suite.
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: part-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part-4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned to the installed @playwright/test version so the runner image can't
    # drift out from under the suite. Ships the browsers already.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TestDino reads branch / commit / author from git metadata

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # Ten tests per engine fail on purpose, so playwright exits non-zero on a
      # healthy run. The exit code is ignored here and the real check happens in
      # the next step, which compares every test's outcome to its @part-4-pass /
      # @part-4-fail tag, per project.
      #
      # P11 carries project-scoped tags (@part-4-pass:chromium
      # @part-4-fail:firefox), so both halves apply here — one expected pass and
      # one expected failure, rather than a cross-engine regression.
      #
      # --project is repeatable, so both engines land in ONE playwright run and
      # therefore one TestDino run, rather than two disconnected ones.
      - name: Run part-4
        continue-on-error: true
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL }}
          TESTDINO_TAGS: part-4,${{ github.head_ref || github.ref_name }}
          PW_JSON_REPORT: part-4-report.json
        run: npx playwright test tests/part-4 --project=chromium --project=firefox

      - name: Check every outcome against its tag
        run: node scripts/verify-part-4-outcomes.js part-4-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-4-report
          path: |
            playwright-report/
            test-results/
            part-4-report.json
          retention-days: 7
