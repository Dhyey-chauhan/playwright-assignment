name: Part 4

# Manual only — this is a fixture suite, not a gate. It runs nothing but
# tests/part-4, under chromium AND firefox, where 10 tests are built to pass
# and 10 are built to fail. A full run is 40 executions: 20 passed, 20 failed.
#
# No workflow_dispatch inputs on purpose: every input GitHub sees becomes a
# form field on the "Run workflow" button, and there is nothing here worth
# choosing. Press the button, get the whole suite in both browsers.
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: part-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part-4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned to the installed @playwright/test version so the runner image can't
    # drift out from under the suite. Ships chromium and firefox already.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TestDino reads branch / commit / author from git metadata

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      # Ten tests per browser fail on purpose, so playwright exits non-zero on a
      # healthy run. The exit code is ignored here and the real check happens in
      # the next step, which compares every test's outcome to its
      # @part-4-pass / @part-4-fail tag, per browser.
      #
      # --project is repeatable, so both browsers land in ONE playwright run and
      # therefore one TestDino run, rather than two disconnected ones.
      - name: Run part-4
        continue-on-error: true
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL }}
          TESTDINO_TAGS: part-4,${{ github.head_ref || github.ref_name }}
          PW_JSON_REPORT: part-4-report.json
        run: npx playwright test tests/part-4 --project=chromium --project=firefox

      - name: Check every outcome against its tag
        run: node scripts/verify-part-4-outcomes.js part-4-report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-4-report
          path: |
            playwright-report/
            test-results/
            part-4-report.json
          retention-days: 7
